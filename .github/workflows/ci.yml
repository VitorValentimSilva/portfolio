name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, build, testes (Chrome, Safari, Firefox) e Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint, formatação e tipos
        run: npm run lint && npm run format:check && npm run typecheck

      - name: Build
        run: npm run build

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Testes E2E (Playwright + axe)
        run: npm run test:e2e

      - name: Lighthouse CI
        run: npm run lhci

      - name: Relatórios
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          include-hidden-files: true
          path: |
            playwright-report/
            .lighthouseci/
          retention-days: 14
